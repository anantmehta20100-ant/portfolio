{% macro architecture_diagram(steps, label) -%}
<ol class="architecture-flow" aria-label="{{ label }}">
  {% for step in steps %}<li>{{ step }}</li>{% endfor %}
</ol>
{%- endmacro %}

{% macro risk_chain(items) -%}
<ol class="risk-chain" aria-label="Illustrative possible relative-risk propagation chain">
  {% for item in items %}<li>{{ item }}</li>{% endfor %}
</ol>
{%- endmacro %}
